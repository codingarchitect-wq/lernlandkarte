<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>German curriculum taxonomy vs os-taxonomy</title>
<style>
.viz-root {
  color-scheme: light;

}
@media (prefers-color-scheme: dark) {

    --ord-1: #9ec5f4; --ord-2: #3987e5; --ord-3: #184f95; --none: #383835;
    --series-1: #3987e5; --div-neg: #3987e5; --div-mid: #5a5955; --div-pos: #e66767;
    --seq-0: #262624; --seq-1: #104281; --seq-2: #1c5cab; --seq-3: #2a78d6; --seq-4: #6da7ec; --seq-5: #b7d3f6;
    --accent-wash: rgba(57,135,229,0.14); --ink-high: #0b0b0b;
  }
}
:root[data-theme="dark"] .viz-root {
  color-scheme: dark;
  --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);

* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.viz-root { background: var(--page); color: var(--text-primary); min-height: 100vh; padding: 24px clamp(12px, 3vw, 40px) 64px; }
h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 16px; margin: 0 0 4px; } h3 { font-size: 14px; margin: 16px 0 6px; }
p.sub, .sub { color: var(--text-secondary); font-size: 13px; margin: 0 0 12px; line-height: 1.45; }
.card { background: var(--surface-1); border: 1px solid var(--ring); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 16px 0; }
.kpi .v { font-size: 32px; font-weight: 600; line-height: 1.1; } .kpi .l { font-size: 12px; color: var(--text-secondary); margin-top: 4px; line-height: 1.35; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--grid); margin: 8px 0 16px; flex-wrap: wrap; }
.tabs button { background: none; border: 0; padding: 8px 12px; font: inherit; font-size: 14px; color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--series-1); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); margin: 6px 0 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.hbar { display: grid; grid-template-columns: 170px 1fr 52px; align-items: center; gap: 8px; font-size: 13px; margin: 3px 0; }
.hbar .lab { color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar .track { display: flex; gap: 2px; height: 16px; }
.hbar .seg { height: 100%; } .hbar .seg:first-child { border-radius: 4px 0 0 4px; } .hbar .seg:last-child { border-radius: 0 4px 4px 0; } .hbar .seg:only-child { border-radius: 4px; }
.hbar .val { font-variant-numeric: tabular-nums; color: var(--text-primary); text-align: right; }
.hit { cursor: default; }
.tip { position: fixed; pointer-events: none; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--ring); box-shadow: 0 4px 16px rgba(0,0,0,.12); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.4; max-width: 320px; z-index: 10; display: none; }
.tip b { font-weight: 600; }
svg text { fill: var(--muted); font-size: 11px; font-family: inherit; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--text-secondary); font-weight: 600; font-size: 12px; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.heat td.c { text-align: center; font-variant-numeric: tabular-nums; min-width: 44px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.filters select, .filters input[type=search] { font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--axis); background: var(--surface-1); color: var(--text-primary); }
.filters input[type=search] { min-width: 240px; }
.filters label { font-size: 13px; color: var(--text-secondary); }
.split { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(320px, 1.2fr); gap: 16px; }
@media (max-width: 860px) { .split, .grid2 { grid-template-columns: 1fr; } .hbar { grid-template-columns: 120px 1fr 44px; } }
.list { max-height: 70vh; overflow: auto; border: 1px solid var(--grid); border-radius: 8px; }
.row { padding: 8px 10px; border-bottom: 1px solid var(--grid); cursor: pointer; font-size: 13px; }
.row:hover, .row[aria-selected="true"] { background: var(--accent-wash); }
.row .meta { color: var(--muted); font-size: 12px; }
.pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--axis); color: var(--text-secondary); margin-right: 4px; white-space: nowrap; }
.pill .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }
.detail { position: sticky; top: 12px; max-height: 80vh; overflow: auto; }
.detail .k { color: var(--muted); font-size: 12px; }
.detail ul, .card ul { margin: 4px 0 8px; padding-left: 18px; font-size: 13px; line-height: 1.5; }
.match { border-top: 1px solid var(--grid); padding: 8px 0; font-size: 13px; }
.count { color: var(--muted); font-size: 12px; margin: 0 0 6px; }
footer { margin-top: 28px; font-size: 12px; color: var(--muted); line-height: 1.5; max-width: 900px; }
.subjtoggle { float: right; margin-left: 8px; display: inline-flex; border: 1px solid var(--axis); border-radius: 6px; overflow: hidden; }
.subjtoggle button { font: inherit; font-size: 12px; background: var(--surface-1); color: var(--text-secondary); border: 0; padding: 4px 9px; cursor: pointer; }
.subjtoggle button[aria-pressed="true"] { background: var(--series-1); color: var(--ink-high); }
.themebtn { float: right; font: inherit; font-size: 12px; background: var(--surface-1); color: var(--text-secondary); border: 1px solid var(--axis); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
a { color: var(--series-1); }
.btn { font: inherit; font-size: 12px; background: var(--surface-1); color: var(--text-secondary); border: 1px solid var(--axis); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.btn:hover { color: var(--text-primary); border-color: var(--series-1); }
.stats { display: flex; gap: 36px; flex-wrap: wrap; margin-top: 6px; }
.stat .v { font-size: 26px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; } .stat .l { font-size: 12px; color: var(--text-secondary); }
.click { cursor: pointer; }
.hbar.click, .dbar.click { border-radius: 4px; padding: 1px 4px; margin-left: -4px; margin-right: -4px; }
.hbar.click:hover .lab, .dbar.click:hover .lab { color: var(--series-1); }
.hbar.on, .dbar.on, tr.on { background: var(--accent-wash); }
.hbar.on .lab, .dbar.on .lab { color: var(--text-primary); font-weight: 600; }
.dbar { display: grid; grid-template-columns: minmax(150px, 1.4fr) minmax(140px, 1fr) 44px 46px; gap: 8px; align-items: center; font-size: 13px; margin: 2px 0; }
.dbar .lab { color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dbar .trk { position: relative; height: 14px; }
.dbar .trk::before { content: ''; position: absolute; left: 50%; top: -3px; bottom: -3px; border-left: 1px solid var(--axis); }
.dbar .b { position: absolute; top: 0; bottom: 0; }
.dbar .val { text-align: right; font-variant-numeric: tabular-nums; }
.dbar .nn { text-align: right; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.scroll { max-height: 460px; overflow: auto; padding-right: 4px; }
.fchip { font: inherit; font-size: 12px; border: 1px solid var(--series-1); color: var(--text-primary); background: var(--accent-wash); border-radius: 999px; padding: 2px 9px; margin: 0 6px 4px 0; cursor: pointer; }
.ptab td { vertical-align: middle; }
.ptab th.dumb, .ptab td.dumb { width: 170px; }
.prow { cursor: pointer; } .prow:hover, .prow.open { background: var(--accent-wash); }
.pdet > td { background: var(--accent-wash); padding: 10px 14px 16px; }
.pdg { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 860px) { .pdg { grid-template-columns: 1fr; } }
.pdg p { font-size: 13px; line-height: 1.5; margin: 4px 0 6px; }
table.mini { width: auto; margin-top: 10px; } table.mini td, table.mini th { padding: 3px 12px 3px 0; border-bottom: 1px solid var(--grid); }
svg text.vlab { fill: var(--text-primary); font-size: 11px; font-weight: 600; }
.k { color: var(--muted); font-size: 12px; }
.langtoggle { margin-left: 8px; }
.filters input[type=search] { min-width: 300px; }
</style>
</head>
<body>
<div class="viz-root">
<div class="langtoggle subjtoggle" role="group" id="lang"><button type="button" data-lang="en">English</button><button type="button" data-lang="de">Deutsch</button><button type="button" data-lang="ro">Română</button></div>
<button class="themebtn" id="theme" type="button"></button>
<div class="subjtoggle" role="group" id="var"><button type="button" data-var="all"></button><button type="button" data-var="core"></button></div>
<h1 id="title"></h1>
<p class="sub" id="intro"></p>
<div class="kpis" id="kpis"></div>
<div class="tabs" role="tablist" id="tabs">
  <button role="tab" aria-selected="true" data-tab="overview"></button>
  <button role="tab" aria-selected="false" data-tab="timing"></button>
  <button role="tab" aria-selected="false" data-tab="de"></button>
  <button role="tab" aria-selected="false" data-tab="os"></button>
  <button role="tab" aria-selected="false" data-tab="gaps"></button>
</div>

<section data-panel="overview">
  <div class="grid2">
    <div class="card"><h2 data-i="covH"></h2><p class="sub" data-i="covSub"></p><div class="legend" id="covLegend"></div><div id="deCov"></div>
      <h3 data-i="byStage"></h3><div id="stageCov"></div><p class="sub" style="margin-top:6px" data-i="stageNote"></p></div>
    <div class="card"><h2 data-i="osCovH"></h2><p class="sub" data-i="osCovSub"></p><div id="osCov"></div></div>
  </div>
  <div class="grid2">
    <div class="card"><h2 data-i="whenH"></h2><p class="sub" data-i="whenSub"></p><div class="legend" id="dLegend1"></div><div id="hist"></div>
      <button class="btn" type="button" data-to-timing></button></div>
    <div class="card"><h2 data-i="jurH"></h2><p class="sub" data-i="jurSub"></p><div id="jurTable"></div>
      <h3 data-i="byStage"></h3><div id="jurStage"></div><p class="sub" style="margin-top:8px" data-i="jurNote"></p></div>
  </div>
  <div class="card"><h2 data-i="matrixH"></h2><p class="sub" data-i="matrixSub"></p><div id="matrix" style="overflow:auto"></div></div>
  <div class="card"><h2 data-i="structH"></h2><div id="structure"></div></div>
</section>

<section data-panel="timing" hidden>
  <div class="card">
    <h2 data-i="whenH"></h2>
    <p class="sub" style="max-width:1000px" data-i="tIntro"></p>
    <div class="filters">
      <label><span data-i="compareWith"></span> <select id="tBase"></select></label>
      <select id="tMatch"></select>
      <select id="tSubj"></select>
      <select id="tStage"></select>
      <button class="btn" type="button" id="tClear"></button>
    </div>
    <p class="sub" id="tNote" style="max-width:1000px"></p>
    <div class="stats" id="tStats"></div>
  </div>
  <div class="grid2">
    <div class="card"><h2 data-i="histH"></h2><p class="sub" id="tHistSub"></p><div class="legend" id="dLegend2"></div><div id="tHist"></div></div>
    <div class="card"><h2 data-i="bySubjH"></h2><p class="sub" data-i="bySubjSub"></p><div class="legend" id="dLegend3"></div><div id="tSub"></div></div>
  </div>
  <div class="card"><h2 id="tDomH"></h2><p class="sub" data-i="byDomSub"></p><div class="scroll" id="tDom"></div></div>
  <div class="card">
    <h2 data-i="pairsH"></h2>
    <p class="sub" id="tSel"></p>
    <div class="filters">
      <input type="search" id="tQ">
      <select id="tSort"></select>
      <span class="legend" style="margin:0" id="dumbLegend"></span>
    </div>
    <div id="tList" style="overflow:auto"></div>
  </div>
</section>

<section data-panel="de" hidden>
  <div class="filters">
    <select id="deSubject"></select>
    <select id="deRel"></select>
    <select id="deGrade"></select>
    <label><input type="checkbox" id="deGS"> <span data-i="specificOnly"></span></label>
    <input type="search" id="deQ">
  </div>
  <div class="split">
    <div><p class="count" id="deCount"></p><div class="list" id="deList"></div></div>
    <div class="card detail" id="deDetail"></div>
  </div>
</section>

<section data-panel="os" hidden>
  <div class="filters">
    <select id="osSubject"></select>
    <select id="osCovSel"></select>
    <input type="search" id="osQ">
  </div>
  <div class="split">
    <div><p class="count" id="osCount"></p><div class="list" id="osList"></div></div>
    <div class="card detail" id="osDetail"></div>
  </div>
</section>

<section data-panel="gaps" hidden>
  <div class="grid2">
    <div class="card"><h2 data-i="gapDeH"></h2><p class="sub" data-i="gapDeSub"></p><div id="gapDe"></div></div>
    <div class="card"><h2 data-i="gapOsH"></h2><p class="sub" data-i="gapOsSub"></p><div id="gapOs"></div></div>
  </div>
</section>
<footer id="footer"></footer>
<div class="tip" id="tip" role="tooltip"></div>
</div>

<script id="exp" type="application/json">__EXPLORER__</script>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const QS = new URLSearchParams(location.search);
const VAR = QS.get('subjects') === 'core' ? 'core' : 'all';
let LANG = ['en', 'de', 'ro'].includes(QS.get('lang')) ? QS.get('lang') : 'en';
const C0 = JSON.parse(document.getElementById('cmp').textContent);
const C = { ...C0, ...(C0.variants?.[VAR] || {}) };
const X = JSON.parse(document.getElementById('exp').textContent);
if (VAR === 'core') { X.de = X.de.filter(t => t.tr !== 'extended'); for (const o of X.os) o.c = o.cc; }

    const w = 50 * Math.abs(r.m) / mx, pos = r.m >= 0;
    const bar = r.m ? `<div class="b" style="left:${pos ? 50 : 50 - w}%;width:${w}%;background:${dcol(r.m)};border-radius:${pos ? '0 4px 4px 0' : '4px 0 0 4px'}"></div>` : '<div class="b" style="left:calc(50% - 2px);width:4px;background:var(--div-mid);border-radius:2px"></div>';
    return `<div class="dbar click ${TS.domain === r.k ? 'on' : ''}" data-dom="${esc(r.k)}" ${tipA(L('domTip', { s: esc(deSubj(r.s)), d: esc(deDom(r.s, r.d)), m: sgn(r.m), n: r.n, e: r.e, z: r.n - r.e - r.l, l: r.l }))}><div class="lab">${esc(deDom(r.s, r.d))}${TS.subject ? '' : ` <span class="k">· ${esc(deSubj(r.s))}</span>`}</div><div class="trk">${bar}</div><div class="val">${sgn(r.m)}</div><div class="nn">${r.n}</div></div>`;
  }).join('') || `<p class="sub">${esc(L('noDom'))}</p>`;
  const chips = [];
  if (TS.stage) chips.push(['stage', L('st.' + TS.stage)]);
  if (TS.subject) chips.push(['subject', deSubj(TS.subject)]);
  if (TS.domain) chips.push(['domain', deDom(TS.subject || TS.domain.split('|')[0], TS.domain.split('|')[1])]);
  if (TS.bin != null) chips.push(['bin', `Δ ${binLab(TS.bin)}`]);
  if (TS.q) chips.push(['q', `“${TS.q}”`]);
  $('#tSel').innerHTML = esc(L('tSel', { l: list.length, p: pool.length, b: cmpName(TS.base) })) + (chips.length ? '<br>' : '') + chips.map(([k, v]) => `<button type="button" class="fchip" data-clear="${k}" aria-label="${esc(L('removeFilter', { x: v }))}">${esc(v)} ✕</button>`).join('');
  const srt = {
    later: (a, b) => diff(b) - diff(a) || a.d.s.localeCompare(b.d.s) || a.d.g[0] - b.d.g[0],
    earlier: (a, b) => diff(a) - diff(b) || a.d.s.localeCompare(b.d.s) || a.d.g[0] - b.d.g[0],
    grade: (a, b) => a.d.g[0] - b.d.g[0] || diff(b) - diff(a),
    subject: (a, b) => deSubj(a.d.s).localeCompare(deSubj(b.d.s), LANG) || a.d.d.localeCompare(b.d.d) || diff(b) - diff(a),
  }[TS.sort];
  list.sort(srt);
  $('#tList').innerHTML = list.length ? `<table class="ptab"><thead><tr><th>${esc(L('thDeTopic'))}</th><th>${esc(L('thGrade'))}</th><th>${esc(L('thOsTopic'))}</th><th>${esc(L('thMatch'))}</th><th class="dumb">${esc(L('thStart'))}${dumbAxis()}</th><th class="n">Δ</th></tr></thead><tbody>` + list.map(p => {
    const b = baseAge(p, TS.base), v = diff(p), open = TS.open === p.d.k;
    return `<tr class="prow ${open ? 'open' : ''}" data-k="${esc(p.d.k)}"><td><b>${esc(nmDe(p.d))}</b><div class="k">${esc(altDe(p.d))} · ${esc(deSubj(p.d.s))} › ${esc(deDom(p.d.s, p.d.d))}</div></td><td>${gradeLab(p.d.g)}</td><td>${esc(p.o.n)}<div class="k">${esc(osSubj(p.o.s))} › ${esc(p.o.d)}</div></td><td><span class="pill">${esc(REL(p.rel))}</span></td><td class="dumb" ${tipA(L('dumbTip', { a: p.d.a[0], g: gradeLab(p.d.g), b: esc(baseName(TS.base)), c: b, d: sgn(v) }))}>${dumb(b, p.d.a[0])}</td><td class="n"><b>${sgn(v)}</b></td></tr>` + (open ? `<tr class="pdet"><td colspan="6">${pairDetail(p)}</td></tr>` : '');
  }).join('') + '</tbody></table>' : `<p class="sub">${esc(L('noPairs'))}</p>`;
}
$('#tBase').onchange = e => { TS.base = e.target.value; TS.bin = null; renderTiming(); };
$('#tMatch').onchange = e => { TS.match = e.target.value; renderTiming(); };
$('#tStage').onchange = e => { TS.stage = e.target.value; TS.bin = null; renderTiming(); };
$('#tSubj').onchange = e => { TS.subject = e.target.value; TS.domain = ''; renderTiming(); };
$('#tSort').onchange = e => { TS.sort = e.target.value; renderTiming(); };
$('#tQ').oninput = e => { TS.q = e.target.value.trim(); renderTiming(); };
$('#tClear').onclick = () => { Object.assign(TS, { stage: '', subject: '', domain: '', bin: null, q: '', open: null }); renderTiming(); };
$('#tHist').onclick = e => { const b = e.target.closest('[data-bin]'); if (!b) return; const v = +b.dataset.bin; TS.bin = TS.bin === v ? null : v; renderTiming(); };
$('#tSub').onclick = e => { const r = e.target.closest('[data-s]'); if (!r) return; TS.subject = TS.subject === r.dataset.s ? '' : r.dataset.s; TS.domain = ''; renderTiming(); };
$('#tDom').onclick = e => { const r = e.target.closest('[data-dom]'); if (!r) return; TS.domain = TS.domain === r.dataset.dom ? '' : r.dataset.dom; renderTiming(); };
$('#tSel').onclick = e => { const c = e.target.closest('[data-clear]'); if (!c) return; const k = c.dataset.clear; if (k === 'subject') { TS.subject = ''; TS.domain = ''; } else if (k === 'bin') TS.bin = null; else TS[k] = ''; renderTiming(); };
$('#tList').onclick = e => { if (e.target.closest('a')) return; const r = e.target.closest('.prow[data-k]'); if (!r) return; TS.open = TS.open === r.dataset.k ? null : r.dataset.k; renderTiming(); };

// ---------- gaps ----------
function renderGaps() {
  const bySub = {};
  for (const g of C.germanOnly) (bySub[g.subject] ||= []).push(deByKey.get(g.key) || { N: { en: g.name, de: g.nameDe } });
  $('#gapDe').innerHTML = Object.entries(bySub).sort((a, b) => b[1].length - a[1].length).map(([s, xs]) => `<h3>${esc(deSubj(s))} <span class="k">(${xs.length})</span></h3><p style="font-size:13px;line-height:1.6">${xs.map(t => `<span title="${esc(altDe(t) || '')}">${esc(nmDe(t))}</span>`).join(' · ')}</p>`).join('');
  const osGap = {};
  for (const d of C.osUnmatchedDomains) (osGap[d.subject] ||= []).push(d);
  const partial = C.osCoverage.flatMap(s => s.domains.filter(d => d.covered > 0 && d.pct < 25).map(d => ({ subject: s.subject, ...d })));
  $('#gapOs').innerHTML = (Object.entries(osGap).map(([s, ds]) => `<h3>${esc(osSubj(s))}</h3><ul>${ds.map(d => `<li>${esc(d.domain)} <span class="k">${esc(L('nTopics', { n: d.topics }))}</span></li>`).join('')}</ul>`).join('') || `<p class="sub">${esc(L('gapAllCovered'))}</p>`) +
    (partial.length ? `<h3>${esc(L('barely'))}</h3><ul>${partial.map(d => `<li>${esc(osSubj(d.subject))} › ${esc(d.domain)} <span class="k">${d.covered}/${d.topics}</span></li>`).join('')}</ul>` : '');
}

function renderAll() { renderStatic(); renderOverview(); renderTiming(); renderDe(); renderOs(); renderGaps(); }
// deep links: #de/<German key or id>, #os/<os id>; #overview, #timing, #de, #os, #gaps open a tab
function openHash() {
  const [kind, ref] = decodeURIComponent(location.hash.slice(1)).split('/');
  if (kind === 'de' && ref) { const t = deByKey.get(ref) || deById.get(ref); if (t) { showTab('de'); $('#deQ').value = nmDe(t); renderDe(); showDe(t.id); } }
  else if (kind === 'os' && ref && osById.has(ref)) { showTab('os'); $('#osQ').value = osById.get(ref).n; renderOs(); showOs(ref); }
  else if (['overview', 'timing', 'de', 'os', 'gaps'].includes(kind)) showTab(kind);
}
renderAll(); addEventListener('hashchange', openHash); openHash();
</script>
</body>
</html>
