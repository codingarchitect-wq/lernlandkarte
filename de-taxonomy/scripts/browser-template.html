<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lernlandkarte</title>
<style>
.viz-root {
  color-scheme: light;
  --page: #f9f9f7; --surface-1: #fcfcfb; --text-primary: #0b0b0b; --text-secondary: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
  --ord-1: #104281; --ord-2: #2a78d6; --ord-3: #86b6ef;
  --series-1: #2a78d6; --accent-wash: rgba(42,120,214,0.08); --ink-high: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --ord-1: #9ec5f4; --ord-2: #3987e5; --ord-3: #184f95;
    --series-1: #3987e5; --accent-wash: rgba(57,135,229,0.14); --ink-high: #0b0b0b;
  }
}
:root[data-theme="dark"] .viz-root {
  color-scheme: dark;
  --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
  --ord-1: #9ec5f4; --ord-2: #3987e5; --ord-3: #184f95;
  --series-1: #3987e5; --accent-wash: rgba(57,135,229,0.14); --ink-high: #0b0b0b;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.viz-root { background: var(--page); color: var(--text-primary); min-height: 100vh; padding: 24px clamp(12px, 3vw, 40px) 64px; }
h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 17px; margin: 0 0 4px; line-height: 1.3; } h3 { font-size: 14px; margin: 16px 0 6px; }
.sub { color: var(--text-secondary); font-size: 13px; margin: 0 0 12px; line-height: 1.45; }
.k { color: var(--muted); font-size: 12px; }
a { color: var(--series-1); }
.card { background: var(--surface-1); border: 1px solid var(--ring); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
.top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.ctl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); }
.toggle { display: inline-flex; border: 1px solid var(--axis); border-radius: 6px; overflow: hidden; }
.toggle button, .btn { font: inherit; font-size: 12px; background: var(--surface-1); color: var(--text-secondary); border: 0; padding: 5px 10px; cursor: pointer; }
.btn { border: 1px solid var(--axis); border-radius: 6px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--series-1); border-color: var(--series-1); color: var(--ink-high); }
.toggle button[aria-pressed="true"] { background: var(--series-1); color: var(--ink-high); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 16px 0; }
.kpi { margin: 0; } .kpi .v { font-size: 28px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; } .kpi .l { font-size: 12px; color: var(--text-secondary); margin-top: 4px; line-height: 1.35; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--grid); margin: 8px 0 16px; flex-wrap: wrap; }
.tabs button { background: none; border: 0; padding: 8px 12px; font: inherit; font-size: 14px; color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--series-1); font-weight: 600; }
.sbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.sbtn { font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--axis); background: var(--surface-1); color: var(--text-primary); cursor: pointer; }
.sbtn .k { margin-left: 2px; }
.sbtn[aria-pressed="true"] { background: var(--series-1); border-color: var(--series-1); color: var(--ink-high); }
.sbtn[aria-pressed="true"] .k { color: inherit; opacity: .8; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.filters select, .filters input[type=search] { font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--axis); background: var(--surface-1); color: var(--text-primary); }
.filters input[type=search] { min-width: 260px; }
.filters label { font-size: 13px; color: var(--text-secondary); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); margin: 6px 0 10px; align-items: center; }
.legend .sw { display: inline-block; width: 22px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -2px; background: var(--page); }
/* curriculum map */
.mapwrap { overflow: auto; max-height: 76vh; border: 1px solid var(--grid); border-radius: 10px; background: var(--surface-1); }
.map { display: grid; width: 100%; }
.map > div { border-bottom: 1px solid var(--grid); border-right: 1px solid var(--grid); padding: 8px; }
.map .hd { position: sticky; top: 0; z-index: 2; background: var(--surface-1); font-size: 13px; font-weight: 600; }
.map .hd .k { font-weight: 400; }
.map .dl { position: sticky; left: 0; z-index: 1; background: var(--surface-1); font-size: 13px; font-weight: 600; cursor: pointer; line-height: 1.3; }
.map .hd.corner { left: 0; z-index: 3; }
.map .dl:hover { color: var(--series-1); }
.map .dl .k { font-weight: 400; display: block; margin-top: 2px; }
.cell { display: flex; flex-direction: column; gap: 4px; }
.chip { text-align: left; font: inherit; font-size: 12px; line-height: 1.3; padding: 5px 7px; border-radius: 6px; border: 1px solid var(--grid); background: var(--page); color: var(--text-primary); cursor: pointer; }
.chip:hover { border-color: var(--series-1); }
.chip .sp { color: var(--muted); font-size: 11px; margin-left: 4px; white-space: nowrap; }
.chip .xde, .xde { display: inline-block; font-size: 10px; line-height: 1; padding: 2px 4px; margin-left: 4px; border-radius: 3px; border: 1px solid var(--axis); color: var(--text-secondary); vertical-align: 1px; }
.chip.dim { opacity: .22; }
.chip.sel { background: var(--series-1); color: var(--ink-high); border-color: var(--series-1); }
.chip.sel .sp, .chip.sel .xde { color: inherit; border-color: currentColor; }
.chip.pre { border: 2px solid var(--ord-1); padding: 4px 6px; }
.chip.dep { border: 2px dashed var(--ord-2); padding: 4px 6px; }
.legend .sw.pre { border: 2px solid var(--ord-1); } .legend .sw.dep { border: 2px dashed var(--ord-2); } .legend .sw.sel { background: var(--series-1); }
/* lists */
.list { max-height: 72vh; overflow: auto; border: 1px solid var(--grid); border-radius: 8px; background: var(--surface-1); }
.row { padding: 8px 10px; border-bottom: 1px solid var(--grid); cursor: pointer; font-size: 13px; }
.row:hover, .row[aria-selected="true"] { background: var(--accent-wash); }
.row .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
.count { color: var(--muted); font-size: 12px; margin: 0 0 6px; }
.pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--axis); color: var(--text-secondary); margin-right: 4px; white-space: nowrap; }
.pill.hard { border-color: var(--ord-1); color: var(--text-primary); }
/* drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--surface-1); color: var(--text-primary); border-left: 1px solid var(--ring); box-shadow: -8px 0 28px rgba(0,0,0,.14); overflow: auto; padding: 16px 22px 48px; transform: translateX(105%); transition: transform .18s ease; z-index: 20; }
.drawer.open { transform: none; }
.drawer .bar { position: sticky; top: -16px; margin: -16px -22px 10px; padding: 10px 22px; background: var(--surface-1); border-bottom: 1px solid var(--grid); display: flex; gap: 8px; justify-content: flex-end; z-index: 1; }
.drawer h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-secondary); margin: 20px 0 6px; }
.drawer p { font-size: 13.5px; line-height: 1.55; margin: 6px 0; }
.drawer ul { margin: 4px 0 8px; padding-left: 18px; font-size: 13px; line-height: 1.5; }
.drawer li { margin: 3px 0; }
.drawer .pills { margin: 8px 0; display: flex; flex-wrap: wrap; gap: 4px; }
.quote { border-left: 3px solid var(--series-1); padding: 6px 10px; margin: 6px 0; font-size: 13px; line-height: 1.5; background: var(--accent-wash); border-radius: 0 6px 6px 0; }
.ref { border-top: 1px solid var(--grid); padding: 7px 0; font-size: 13px; line-height: 1.45; }
code { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--text-secondary); }
.lnk { background: none; border: 0; padding: 0; font: inherit; color: var(--series-1); cursor: pointer; text-align: left; }
.lnk:hover { text-decoration: underline; }
/* learning path */
.graphwrap { overflow: auto; max-height: 74vh; border: 1px solid var(--grid); border-radius: 10px; background: var(--surface-1); margin-bottom: 16px; }
.gnode { cursor: pointer; }
.gnode rect { fill: var(--page); stroke: var(--axis); stroke-width: 1.2; }
.gnode.same rect { stroke: var(--series-1); stroke-width: 1.6; }
.gnode.focus rect { fill: var(--series-1); stroke: var(--series-1); }
.gnode:hover rect { stroke-width: 2.6; }
svg text { font-family: inherit; fill: var(--muted); font-size: 11px; }
.gnode .t1 { fill: var(--text-primary); font-size: 12px; }
.gnode .t2 { fill: var(--muted); font-size: 10.5px; }
.gnode.focus .t1, .gnode.focus .t2 { fill: var(--ink-high); }
.gedge { fill: none; stroke: var(--axis); stroke-width: 1.4; }
.gedge.soft { stroke-dasharray: 5 4; }
.gedge.hl { stroke: var(--series-1); stroke-width: 2.4; }
.ghit { fill: none; stroke: transparent; stroke-width: 10; }
.colhd { fill: var(--text-secondary); font-size: 11.5px; font-weight: 600; }
.sug { position: absolute; top: 40px; left: 0; width: min(560px, 92vw); z-index: 5; background: var(--surface-1); border: 1px solid var(--ring); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.14); max-height: 380px; overflow: auto; }
.lg-node { display: inline-block; width: 22px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -2px; background: var(--page); border: 1.6px solid var(--series-1); }
.lg-node.other { border: 1.2px solid var(--axis); } .lg-node.focus { background: var(--series-1); }
.cols { columns: 3 260px; column-gap: 24px; font-size: 13px; }
.cols .grp { break-inside: avoid; margin-bottom: 10px; }
.cols .grp b { display: block; margin-bottom: 2px; }
/* tables */
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--text-secondary); font-weight: 600; font-size: 12px; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.srow { cursor: pointer; } .srow:hover { background: var(--accent-wash); }
.ptable td { min-width: 230px; line-height: 1.5; }
.ptable td:first-child { min-width: 170px; font-weight: 600; }
.tip { position: fixed; pointer-events: none; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--ring); box-shadow: 0 4px 16px rgba(0,0,0,.12); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.4; max-width: 340px; z-index: 30; display: none; }
footer { margin-top: 28px; font-size: 12px; color: var(--muted); line-height: 1.5; max-width: 900px; }
@media (max-width: 760px) { .filters input[type=search] { min-width: 0; width: 100%; } }
</style>
</head>
<body>
<div class="viz-root">
<div class="top">
  <div>
    <h1 id="title"></h1>
    <p class="sub" style="max-width:860px" id="intro"></p>
  </div>
  <div class="ctl">
    <span id="lSubjects"></span>
    <div class="toggle" id="tier" role="group"><button type="button" data-tier="all"></button><button type="button" data-tier="core"></button></div>
    <span id="lLang"></span>
    <div class="toggle" id="lang" role="group"><button type="button" data-lang="en">English</button><button type="button" data-lang="de">Deutsch</button><button type="button" data-lang="ro">Română</button></div>
    <button class="btn" id="theme" type="button"></button>
  </div>
</div>
<div class="kpis" id="kpis"></div>
<div class="tabs" role="tablist" id="tabs">
  <button role="tab" aria-selected="true" data-tab="map"></button>
  <button role="tab" aria-selected="false" data-tab="topics"></button>
  <button role="tab" aria-selected="false" data-tab="path"></button>
  <button role="tab" aria-selected="false" data-tab="parents"></button>
  <button role="tab" aria-selected="false" data-tab="sources"></button>
</div>

<section data-panel="map">
  <div class="sbar" id="mapSubj"></div>
  <p class="sub" id="mapDesc" style="max-width:980px"></p>
  <div class="filters">
    <input type="search" id="mapQ">
    <div class="toggle" id="mapStage" role="group"></div>
    <label><input type="checkbox" id="mapX"> <span id="lMapX"></span></label>
    <span class="k" id="mapCount"></span>
  </div>
  <div class="legend" id="mapLegend"></div>
  <div class="mapwrap"><div id="map"></div></div>
</section>

<section data-panel="topics" hidden>
  <div class="filters">
    <select id="fS"></select>
    <select id="fD"></select>
    <select id="fG"></select>
    <select id="fL"></select>
    <select id="fT"></select>
    <select id="fO"></select>
    <label><input type="checkbox" id="fX"> <span id="lFX"></span></label>
    <select id="fSort"></select>
    <input type="search" id="fQ">
  </div>
  <p class="count" id="fCount"></p>
  <div class="list" id="fList"></div>
</section>

<section data-panel="path" hidden>
  <div class="filters" style="position:relative">
    <input type="search" id="pq" autocomplete="off">
    <div class="sug" id="psug" hidden></div>
    <label><span id="lShow"></span> <select id="pSteps"></select></label>
    <label><input type="checkbox" id="pUnl" checked> <span id="lUnl"></span></label>
    <button class="btn" id="pBack" type="button" disabled></button>
  </div>
  <div class="card" id="pFocus"></div>
  <div class="legend" id="pLegend"></div>
  <div class="graphwrap" id="graph"></div>
  <div class="card" id="pList"></div>
</section>

<section data-panel="parents" hidden>
  <p class="sub" style="max-width:900px" id="parIntro"></p>
  <div class="sbar" id="parSubj"></div>
  <div class="card" style="overflow:auto" id="parBody"></div>
</section>

<section data-panel="sources" hidden>
  <p class="sub" style="max-width:900px" id="srcIntro"></p>
  <div class="card" style="overflow:auto"><table id="srcT"></table></div>
</section>

<footer id="footer"></footer>

<aside class="drawer" id="drawer"><div class="bar"><button class="btn" id="dClose" type="button"></button></div><div id="dBody"></div></aside>
<div class="tip" id="tip" role="tooltip"></div>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tipA = h => `data-tip="${esc(h)}"`;

// ---------- country and language ----------
// One template serves the German and the Romanian taxonomy (D.cfg.country). The page language is the
// country's language or English (?lang=en); it changes the interface, the topic names and, where the
// data has them, the topic texts (ds/ev/ap/ln + "N" = native version).
const CFG = D.cfg || { country: 'de', native: 'de' };
const NAT = CFG.native;
const ROMAN = ['CP', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];
const COUNTRY = {
  de: {
    ageOff: 5, maxGrade: 13, stages: [['gs', 0, 4, 'Vorschule–4'], ['s1', 5, 10, '5–10'], ['s2', 11, 13, 'Oberstufe 11–13']],
    gl: g => g === 0 ? 'Vorschule' : `Kl. ${g}`, gEnd: g => String(g),
    colLab: g => g === 0 ? 'Vorschule' : g === 11 ? 'Klasse 11 · E-Phase' : g === 12 ? 'Klasse 12 · Q1' : g === 13 ? 'Klasse 13 · Q2' : 'Klasse ' + g,
    bandOf: g => g === 0 ? 0 : g <= 2 ? 1 : g <= 4 ? 3 : g <= 6 ? 5 : g <= 8 ? 7 : g <= 10 ? 9 : 11,
    BAND: { 0: 'Vorschule', 1: 'Kl. 1–2', 3: 'Kl. 3–4', 5: 'Kl. 5–6', 7: 'Kl. 7–8', 9: 'Kl. 9–10', 11: 'Oberstufe (Kl. 11–13)' },
    graph: 'graph.html', compare: '../comparison/index.html', compareTopic: (k, q) => `../comparison/index.html${q}#de/${k}`,
    defaultPath: t => (D.topics.find(x => x.k === 'ma-zo-schriftliche-subtraktion') || t),
    levels: ['gA', 'eA'], levelMatch: (t, v) => t.cl === v, levelLab: t => t.cl ? L('lvl.' + t.cl) : '', levelHard: t => t.cl === 'eA',
    badge: t => t.cl === 'eA' ? ['LK', L('lvl.eA')] : null, region: s => s.region || L('src.de.scope'),
    sortSources: (a, b) => (!!a.region - !!b.region) || a.region.localeCompare(b.region) || (b.name.startsWith('KMK') - a.name.startsWith('KMK')) || a.name.localeCompare(b.name),
  },
  ro: {
    ageOff: 6, maxGrade: 12, stages: [['pr', 0, 4, 'Primar CP–IV'], ['gm', 5, 8, 'Gimnaziu V–VIII'], ['li', 9, 12, 'Liceu IX–XII']],
    gl: g => g === 0 ? 'CP' : `cl. ${ROMAN[g]}`, gEnd: g => ROMAN[g],
    colLab: g => g === 0 ? 'Clasa pregătitoare' : g === 1 ? 'Clasa I' : `Clasa a ${ROMAN[g]}-a`,
    bandOf: g => g <= 2 ? 0 : g <= 4 ? 3 : g <= 6 ? 5 : g <= 8 ? 7 : g <= 10 ? 9 : 11,
    BAND: { 0: 'CP–II', 3: 'cl. III–IV', 5: 'cl. V–VI', 7: 'cl. VII–VIII', 9: 'liceu IX–X', 11: 'liceu XI–XII' },
    graph: '../de-taxonomy/graph.html#ro', compare: '../comparison-ro-de/index.html', compareTopic: (k, q) => `../comparison-ro-de/index.html${q}#ro/${k}`,
    defaultPath: t => D.topics.filter(x => x.s === 'Matematică' && x.g[0] <= 8).reduce((b, x) => (depth(x.i) > depth(b.i) ? x : b), D.topics.find(x => x.s === 'Matematică') || t),
    levels: ['all4', 'some', 'MI', 'SN', 'SS', 'FIL'],
    levelMatch: (t, v) => !!t.cl && (v === 'all4' ? t.cl.length === 4 : v === 'some' ? t.cl.length < 4 : t.cl.includes(v)),
    levelLab: t => !t.cl ? '' : t.cl.length === 4 ? L('prof.all') : L('prof.only', { list: t.cl.map(p => PROF[p]).join(', ') }),
    levelHard: t => !!t.cl && t.cl.length < 4, badge: t => t.cl && t.cl.length < 4 ? [t.cl.join('·'), CFG_C.levelLab(t)] : null,
    region: () => L('src.ro.scope'), sortSources: (a, b) => (a.first ?? 99) - (b.first ?? 99) || a.name.localeCompare(b.name, 'ro'),
  },
};
const CFG_C = COUNTRY[CFG.country];
const PROF = { MI: 'matematică-informatică', SN: 'științe ale naturii', SS: 'științe sociale', FIL: 'filologie' };

// Interface strings. Country-specific keys end in ".de" / ".ro"; {x} are placeholders; "_one" is the singular.
const I18N = {
  en: {
    'title.de': 'German curriculum taxonomy · Vorschule–Klasse 13',
    'intro.de': 'What children learn in German schools from Vorschule to the Abitur (Gymnasium from Klasse 7, G9 numbering), as small teachable topics linked by prerequisites. Built from the KMK Bildungsstandards, the GDSU Perspektivrahmen Sachunterricht and Länder curricula (NRW, Bayern, Baden-Württemberg, Berlin/Brandenburg, Niedersachsen). Version {ver}, generated {gen}. {graph} · {compare}',
    'link.graph': 'See it as a 3D map →', 'link.compare.de': 'Compare with os-taxonomy →',
    'title.ro': 'Romanian curriculum taxonomy · clasa pregătitoare – a XII-a',
    'intro.ro': 'What children learn in Romanian schools from clasa pregătitoare to the Bacalaureat (theoretical liceu: matematică-informatică, științe ale naturii, științe sociale, filologie), as small teachable topics linked by prerequisites. Built from the national <i>programe școlare</i> and <i>planuri-cadru</i>. Version {ver}, generated {gen}. {graph} · {compare}',
    'link.compare.ro': 'Compare with the German taxonomy →',
    subjects: 'Subjects', all: 'All', coreOnly: 'Core only', language: 'Language', theme: 'Theme', themeAria: 'Toggle light or dark theme',
    'core.de': 'Hide Französisch, Latein, Musik, Kunst, Sport and Religion & Ethik',
    'core.ro': 'Hide Limba franceză, Limba latină, Educație muzicală, Arte vizuale, Educație fizică și sport, Religie, Educație tehnologică and Dezvoltare personală și consiliere',
    'tab.map': 'Curriculum map', 'tab.topics': 'All topics', 'tab.path': 'Learning paths', 'tab.parents': 'Parent summaries', 'tab.sources': 'Curriculum sources',
    'kpi.topics': 'micro-topics in {s} subjects', 'kpi.core': ' (core only)', 'kpi.edges': 'prerequisite links ({h} required, {s} helpful)', 'kpi.sources': 'curriculum sources with {c} referenced codes',

let PF = CFG_C.defaultPath(T[0]).i; const PHIST = [];

function drawPath(f, anc, unl) {
  const set = new Set([f, ...anc.keys()]), Ly = new Map([[f, 0]]);
  const lay = n => { if (Ly.has(n)) return Ly.get(n); let m = 0; for (const e of dep[n]) if (set.has(e.t)) m = Math.max(m, lay(e.t) + 1); Ly.set(n, m); return m; };

  const fs = T[f].s, own = n => T[n].s === fs ? 0 : 1;
  for (const c of cols) c.sort((a, b) => own(a) - own(b) || T[a].g[0] - T[b].g[0] || nm(T[a]).localeCompare(nm(T[b])));
  const right = n => n === f ? unl : dep[n].filter(e => set.has(e.t)).map(e => e.t);
  const left = n => unl.includes(n) && !set.has(n) ? [f] : pre[n].filter(e => set.has(e.t)).map(e => e.t);
  const pos = new Map(), setPos = () => cols.forEach(c => c.forEach((n, k) => pos.set(n, k - (c.length - 1) / 2)));
  const bary = (c, nb) => { const v = new Map(c.map(n => { const ns = nb(n).filter(x => pos.has(x)); return [n, ns.length ? ns.reduce((a, x) => a + pos.get(x), 0) / ns.length : pos.get(n)]; })); c.sort((a, b) => v.get(a) - v.get(b)); };
  setPos();
  for (let it = 0; it < 4; it++) {
    for (let c = cols.length - 1; c >= 0; c--) if (c !== maxL && c < maxL) { bary(cols[c], right); setPos(); }
    for (let c = 0; c < cols.length; c++) if (c !== maxL && c > 0) { bary(cols[c], left); setPos(); }
  }
  const NW = 214, NH = 42, GX = 52, GY = 10, PAD = 16, HEAD = 26;

  const trunc = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(L('pathAria'))}">`;
  cols.forEach((c, ci) => { const k = maxL - ci; const lab = ci > maxL ? L('col.next') : k === 0 ? L('col.centre') : k === 1 ? L('col.direct') : L('col.steps', { k }); s += `<text class="colhd" x="${PAD + ci * (NW + GX) + NW / 2}" y="${PAD + 12}" text-anchor="middle">${esc(lab)}</text>`; });
  for (const [a, b, h, r, tgt] of edges) { const d = curve(a, b); const tt = tipA(`<b>${esc(nm(T[a]))}</b> → <b>${esc(nm(T[tgt]))}</b><br>${esc(L(h ? 'required' : 'helpful'))}: ${esc(r)}`); s += `<path class="gedge ${h ? '' : 'soft'}" data-a="${a}" data-b="${tgt}" d="${d}"/><path class="ghit" d="${d}" ${tt}/>`; }
  cols.forEach((c, ci) => c.forEach(n => {
    const [x, y] = XY.get(n), t = T[n];
    const cls = n === f && ci === maxL ? 'focus' : t.s === fs ? 'same' : '';
    s += `<g class="gnode ${cls}" data-i="${n}" transform="translate(${x},${y})" ${tipA(`<b>${esc(nm(t))}</b><br>${esc(alt(t))}<br>${gradeLab(t)} · ${esc(sname(t.s))} › ${esc(dname(t.s, t.d))}<br><span style="color:var(--muted)">${esc(L(n === f ? 'tip.centre' : 'tip.recentre'))}</span>`)}><rect width="${NW}" height="${NH}" rx="6"/><text class="t1" x="9" y="17">${esc(trunc(nm(t), 31))}</text><text class="t2" x="9" y="32">${esc(trunc(gradeLab(t) + ' · ' + sname(t.s), 36))}</text></g>`;
  }));
  return s + '</svg>';
}
$('#graph').addEventListener('click', e => {
  const g = e.target.closest('.gnode'); if (!g) return;
  const i = +g.dataset.i;
  if (i === PF) { openTopic(i); return; }
  focusPath(i); renderPath(); history.replaceState(null, '', location.search + '#path/' + T[i].k);
});
$('#graph').addEventListener('mouseover', e => {
  const g = e.target.closest('.gnode'); const id = g ? g.dataset.i : null;
  for (const p of document.querySelectorAll('#graph .gedge')) p.classList.toggle('hl', id != null && (p.dataset.a === id || p.dataset.b === id));
});
$('#pList').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (b) { focusPath(+b.dataset.c); renderPath(); scrollTo({ top: $('#pFocus').offsetTop - 12, behavior: 'smooth' }); history.replaceState(null, '', location.search + '#path/' + T[PF].k); } });
$('#pBack').onclick = () => { if (!PHIST.length) return; PF = PHIST.pop(); renderPath(); history.replaceState(null, '', location.search + '#path/' + T[PF].k); };
$('#pSteps').addEventListener('change', renderPath); $('#pUnl').addEventListener('change', renderPath);
$('#pq').addEventListener('input', () => {
  const q = $('#pq').value.trim().toLowerCase(), box = $('#psug');
  if (!q) { box.hidden = true; return; }
  const xs = T.filter(t => shown(t.s) && t.q.includes(q)).sort((a, b) => (nm(b).toLowerCase().startsWith(q) - nm(a).toLowerCase().startsWith(q)) || byGrade(a, b)).slice(0, 14);
  box.innerHTML = xs.map(t => `<div class="row" data-i="${t.i}"><b>${esc(nm(t))}</b> <span class="k">· ${esc(alt(t))}</span><div class="meta">${esc(sname(t.s))} · ${gradeLab(t)} · ${esc(L('topicsBefore', { n: reach(t.i, pre).size }))}</div></div>`).join('') || `<div class="row k">${esc(L('noMatch'))}</div>`;
  box.hidden = false;
});
$('#psug').addEventListener('click', e => { const r = e.target.closest('.row[data-i]'); if (!r) return; focusPath(+r.dataset.i); $('#psug').hidden = true; $('#pq').value = ''; renderPath(); history.replaceState(null, '', location.search + '#path/' + T[PF].k); });
document.addEventListener('click', e => { if (!e.target.closest('#psug') && e.target !== $('#pq')) $('#psug').hidden = true; });

// ---------- parent summaries ----------
let parS = SUBJ[0].name;
function renderParents() {
  subjectBar($('#parSubj'), parS, s => { parS = s; renderParents(); });
  const si = subjInfo.get(parS), ts = T.filter(t => t.s === parS);
  const bands = [...new Set(CL.filter(c => c.s === parS).map(c => c.g))].sort((a, b) => a - b);
  const doms = si.domains.map(d => d.name).filter(d => ts.some(t => t.d === d) || CL.some(c => c.s === parS && c.d === d));
  $('#parBody').innerHTML = `<table class="ptable"><thead><tr><th>${esc(L('domain'))}</th>${bands.map(b => `<th>${BAND[b]}</th>`).join('')}</tr></thead><tbody>` +
    doms.map(d => `<tr><td>${esc(dname(parS, d))}<div class="k" style="font-weight:400">${esc(dalt(parS, d))}</div></td>${bands.map(b => { const c = clusterFor(parS, d, b); const n = ts.filter(t => t.d === d && bandOf(t.g[0]) === b).length;
      return `<td>${c ? esc(clText(c)) : '<span class="k">–</span>'}${n ? `<div style="margin-top:4px"><button type="button" class="lnk" data-pd="${esc(d)}">${esc(L('nTopics', { n }))} →</button></div>` : ''}</td>`; }).join('')}</tr>`).join('') + '</tbody></table>';
}
$('#parBody').addEventListener('click', e => { const b = e.target.closest('[data-pd]'); if (b) openDomain(parS, b.dataset.pd); });

// ---------- sources ----------
let OPEN_SRC = null;
function renderSources() {
  const rows = [...D.sources].sort(CFG_C.sortSources);
  const linked = s => new Set(s.codes.flatMap(c => stdTopics.get(s.slug + ':' + c[0]) || [])).size;
  $('#srcT').innerHTML = `<thead><tr><th>${esc(L('src.source'))}</th><th>${esc(L('src.scope'))}</th><th>${esc(L('src.level'))}</th><th class="n">${esc(L('src.codes'))}</th><th class="n">${esc(L('src.topics'))}</th></tr></thead><tbody>` + rows.map(s => {
    let h = `<tr class="srow" data-slug="${esc(s.slug)}"><td><b>${OPEN_SRC === s.slug ? '▾' : '▸'} ${esc(s.name)}</b><div class="k">${esc(s.version)}</div></td><td>${esc(CFG_C.region(s))}</td><td>${esc(s.level)}</td><td class="n">${s.codes.length}</td><td class="n">${linked(s)}</td></tr>`;
    if (OPEN_SRC === s.slug) h += `<tr><td colspan="5"><p class="sub">${esc(pick(s.notes))} ${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(L('src.official'))}</a>` : ''}</p><table><thead><tr><th>${esc(L('src.code'))}</th><th>${esc(L('src.para'))}</th><th>${esc(L('src.area'))}</th><th>${esc(L('src.grade'))}</th><th>${esc(L('src.topics'))}</th></tr></thead><tbody>${s.codes.map(([code, tt, area, gr]) => `<tr><td><code>${esc(code)}</code></td><td>${esc(pick(tt))}</td><td class="k">${esc(area)}</td><td class="k">${esc(gr)}</td><td>${(stdTopics.get(s.slug + ':' + code) || []).map(i => `<div><button type="button" class="lnk" data-go="${i}">${esc(nm(T[i]))}</button></div>`).join('') || '<span class="k">–</span>'}</td></tr>`).join('')}</tbody></table></td></tr>`;
    return h;
  }).join('') + '</tbody>';
}
$('#srcT').addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { openTopic(+g.dataset.go); return; }
  const r = e.target.closest('.srow'); if (r) { OPEN_SRC = OPEN_SRC === r.dataset.slug ? null : r.dataset.slug; renderSources(); }
});

// ---------- routing: #t/<key>, #path/<key>, #map/<subject>, #topics, #parents, #sources ----------
function route() {
  const [kind, ...rest] = decodeURIComponent(location.hash.slice(1)).split('/'); const ref = rest.join('/');
  if (kind === 't' && byKey.has(ref)) { const t = byKey.get(ref); mapS = t.s; if (TAB !== 'map') go('map'); else renderMap(); openTopic(t.i); }
  else if (kind === 'path' && byKey.has(ref)) { focusPath(byKey.get(ref).i, false); go('path'); }
  else if (kind === 'map') { if (subjInfo.has(ref)) mapS = ref; go('map'); }
  else if (RENDER[kind]) go(kind);
  else go('map');
}
applyLang(); setTier(CORE); addEventListener('hashchange', route); route();
</script>
</body>
</html>
