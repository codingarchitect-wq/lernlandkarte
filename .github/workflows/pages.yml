# Build and check the taxonomy, then publish the start page, the browser, the 3D map
# and the comparison explorer to GitHub Pages.
name: Publish pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true   # os-taxonomy, needed by the checks and the comparison
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build, validate and render the pages
        working-directory: de-taxonomy
        run: npm run all
      - name: Assemble the site
        run: |
          mkdir -p _site/de-taxonomy _site/comparison
          cp index.html _site/
          cp de-taxonomy/index.html de-taxonomy/graph.html _site/de-taxonomy/
          cp comparison/index.html _site/comparison/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
