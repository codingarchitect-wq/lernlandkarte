# Build and check the taxonomies, then publish the start page, the German and Romanian browsers,
# the 3D map and the two comparison explorers to GitHub Pages.
name: Publish pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true   # os-taxonomy, needed by the checks and the comparison
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build and validate the German taxonomy
        working-directory: de-taxonomy
        run: npm run build && npm run validate
      - name: Build, validate and render the Romanian taxonomy and its comparison with the German one
        working-directory: ro-taxonomy
        run: npm run all
      - name: Render the German pages, the 3D map (all three taxonomies) and the os-taxonomy comparison
        working-directory: de-taxonomy
        run: npm run browser && npm run graph && npm run compare
      - name: Assemble the site
        run: |
          mkdir -p _site/de-taxonomy _site/comparison _site/ro-taxonomy _site/comparison-ro-de
          cp index.html _site/
          cp de-taxonomy/index.html de-taxonomy/graph.html _site/de-taxonomy/
          cp comparison/index.html _site/comparison/
          cp ro-taxonomy/index.html _site/ro-taxonomy/
          cp comparison-ro-de/index.html _site/comparison-ro-de/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
